<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar usuário</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/cadastrar.js" defer></script>
</head>
<body>
  <section class="auth-section">
    <h2 class="auth-title">Cadastrar novo usuário</h2>

    <form id="formCadastro" class="auth-container">
      <div class="imgcontainer">
        <img src="assets/imagem/avatarNovoUser.png" alt="Avatar de novo usuário" class="avatar">
      </div>

      <label for="username">Usuário</label>
      <input type="text" id="username" name="username" required>

      <label for="password">Senha</label>
      <input type="password" id="password" name="password" required>

      <input type="submit" value="Cadastrar">

      <p class="auth-footer">
        <a href="login.html">Voltar para a tela de login</a>
      </p>
    </form>
  </section>
</body>
</html>
