<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Minha Galeria</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <script src="assets/js/storage.js" defer></script>
  <script src="assets/js/register.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Cadastrar novo usuário</h1>
    <form id="registerForm" class="auth-form">
      <div class="avatar-container">
        <img src="Imagens/avatarNovoUser.png" alt="Avatar de novo usuário" class="avatar">
      </div>

      <label for="username">Usuário</label>
      <input type="text" id="username" name="username" autocomplete="username" required>

      <label for="password">Senha</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required>

      <button type="submit">Cadastrar</button>
      <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>
      <p class="auth-link"><a href="login.html">Voltar para a tela de login</a></p>
    </form>
  </main>
</body>
</html>
