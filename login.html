<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acesse sua galeria pessoal de poemas.">
  <title>Entrar | Minha Galeria</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <script type="module" src="assets/js/pages/login.js"></script>
</head>
<body class="auth-page">
  <main class="auth-card" aria-labelledby="page-title">
    <header class="auth-card__header">
      <img class="auth-card__avatar" src="Imagens/avatar.png" alt="" width="112" height="112">
      <h1 id="page-title">Boas-vindas</h1>
      <p>Entre para acessar sua galeria de poemas.</p>
    </header>

    <form id="login-form" class="form">
      <div class="form__field">
        <label for="username">Usuário</label>
        <input id="username" name="username" type="text" autocomplete="username" minlength="3" required>
      </div>

      <div class="form__field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>
      </div>

      <p id="form-feedback" class="form__feedback" role="alert" aria-live="polite"></p>
      <button class="button" type="submit">Entrar</button>
    </form>

    <p class="auth-card__footer">Ainda não tem conta? <a href="cadastrar.html">Cadastre-se</a></p>
  </main>
</body>
</html>
