<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de poemas</title>
  <link rel="stylesheet" href="css/style.css?v=20260807-rollback">
  <link rel="stylesheet" href="css/galeria.css?v=20260807-rollback">
  <script src="js/galeria.js" defer></script>
</head>
<body>
  <header class="containerTitulo">
    <span id="logout">Logout</span>
    <h1>Galeria de Poemas</h1>
  </header>

  <br>

  <section class="containerCadastro" id="meuContainer">
    <div class="div-1">
      <p>Usuário: <strong id="myUsername"></strong></p>
    </div>

    <p>Adicionar poema</p>
    <input type="text" id="titulo" name="titulo" placeholder="Título">
    <input type="text" id="autor" name="autor" placeholder="Autor">
    <input type="text" id="poema" name="poema" style="height: 100px" placeholder="Poema">

    <div class="containerSelection">
      <label for="select">Categoria:&nbsp;&nbsp;</label>
      <select id="select" name="select">
        <option value="Sem Categoria">Sem Categoria</option>
        <option value="Amor">Amor</option>
        <option value="Tristeza">Tristeza</option>
        <option value="Felicidade">Felicidade</option>
        <option value="Medo">Medo</option>
        <option value="Etc">Etc</option>
      </select>
    </div>

    <button type="button" id="adicionarPoema">Adicionar poema</button>
  </section>

  <br>

  <section class="containerBusca">
    <label for="inputPesquisa">Buscar por título, categoria ou palavra-chave:</label>
    <input type="text" id="inputPesquisa" placeholder="Digite para pesquisar">
  </section>

  <div class="containerGaleria">
    <table id="tbl">
      <thead>
        <tr>
          <th><h2>Poemas</h2></th>
          <th></th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>

    <p class="gallery-footer">
      <a href="login.html">Voltar à tela de login</a>
    </p>
  </div>
</body>
</html>
