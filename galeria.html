<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Poemas</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/gallery.css">
  <script src="assets/js/storage.js" defer></script>
  <script src="assets/js/gallery.js" defer></script>
</head>
<body>
  <header class="page-header">
    <h1>Galeria de Poemas</h1>
    <button id="logoutButton" class="secondary-button" type="button">Sair</button>
  </header>

  <main class="page-content">
    <section id="poemFormSection" class="panel form-panel" aria-labelledby="formTitle">
      <p class="user-label">Usuário: <strong id="currentUsername"></strong></p>
      <h2 id="formTitle">Adicionar poema</h2>

      <form id="poemForm">
        <label for="title">Título</label>
        <input type="text" id="title" name="title" required>

        <label for="author">Autor</label>
        <input type="text" id="author" name="author" required>

        <label for="poem">Poema</label>
        <textarea id="poem" name="poem" rows="5" required></textarea>

        <label for="category">Categoria</label>
        <select id="category" name="category">
          <option value="Sem categoria">Sem categoria</option>
          <option value="Amor">Amor</option>
          <option value="Tristeza">Tristeza</option>
          <option value="Felicidade">Felicidade</option>
          <option value="Medo">Medo</option>
          <option value="Outros">Outros</option>
        </select>

        <button type="submit">Adicionar poema</button>
      </form>
    </section>

    <section class="panel search-panel" aria-labelledby="searchTitle">
      <h2 id="searchTitle">Buscar poemas</h2>
      <label for="searchInput">Título, autor, categoria ou palavra-chave</label>
      <input type="search" id="searchInput" placeholder="Digite para pesquisar">
    </section>

    <section class="gallery-panel" aria-labelledby="galleryTitle">
      <h2 id="galleryTitle">Poemas</h2>
      <p id="emptyMessage" class="empty-message" hidden>Nenhum poema encontrado.</p>
      <div id="poemList" class="poem-list"></div>
    </section>
  </main>
</body>
</html>
